      <g fill="black"><circle cx="14.73" cy="11.1" r="3.1"/><circle cx="5.75" cy="6.75" r="3.1"/><circle cx="8.5" cy="15.75" r="3.1"/><circle cx="6.5" cy="25.25" r="3.1"/><circle cx="25.25" cy="17.75" r="3.1"/></g>
